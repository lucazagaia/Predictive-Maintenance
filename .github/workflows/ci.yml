name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Core runtime only, CPU torch wheel. scikit-learn is pinned to the version that
      # wrote models/scaler_voraus_ad.pkl.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy>=1.24" "scikit-learn==1.6.1" pytest

      - name: Tests
        run: pytest -q

      - name: Demo
        run: python run_demo.py
