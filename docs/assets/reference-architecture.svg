<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="t d">
  <title id="t">Example reference architecture</title>
  <desc id="d">Example reference architecture for a predictive-maintenance system for autonomous delivery robots. The robot acquires runtime data; an edge layer preprocesses it and runs real-time anomaly detection; a cloud backend runs RUL inference, offline training and model updates; an application layer fuses anomaly status and RUL into maintenance recommendations for fleet management; a data storage layer holds historical data, event data and the model base. Components communicate over ROS2 publish/subscribe.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect width="1000" height="720" rx="16" fill="#0b1220"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- title -->
    <text x="500" y="40" fill="#f8fafc" font-size="22" font-weight="800" text-anchor="middle">Example reference architecture</text>
    <text x="500" y="62" fill="#94a3b8" font-size="13" text-anchor="middle">Predictive-maintenance system for autonomous delivery robots</text>

    <!-- communication bar -->
    <rect x="250" y="80" width="500" height="34" rx="8" fill="none" stroke="#475569" stroke-dasharray="6 5"/>
    <text x="500" y="102" fill="#cbd5e1" font-size="13" text-anchor="middle">Communication architecture: ROS2, publish/subscribe</text>

    <!-- ===== ADR / Onboard ===== -->
    <rect x="18" y="134" width="221" height="244" rx="14" fill="#0284c7" fill-opacity="0.07" stroke="#0284c7" stroke-opacity="0.8"/>
    <path d="M32 134H225A14 14 0 0 1 239 148V172H18V148A14 14 0 0 1 32 134Z" fill="#0284c7"/>
    <text x="128.5" y="159" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">ADR / Onboard</text>

    <rect x="30" y="184" width="197" height="126" rx="10" fill="#111a2e" stroke="#0284c7" stroke-opacity="0.7"/>
    <!-- sensor connectors -->
    <g fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="3 3">
      <path d="M58 206H80V232H99"/>
      <path d="M58 242H99"/>
      <path d="M58 278H80V260H99"/>
      <path d="M199 206H178V232H159"/>
      <path d="M197 244H159"/>
      <path d="M197 278H178V260H159"/>
    </g>
    <!-- sensor icons: control system, power supply, effectors | temperature, fault, vibration -->
    <g fill="none" stroke="#cbd5e1" stroke-width="1.6">
      <circle cx="50" cy="206" r="7"/>
      <path d="M43 206H57M50 206V213"/>
      <rect x="42" y="237.5" width="14" height="9" rx="1.5"/>
      <circle cx="50" cy="278" r="5.5" stroke-width="3.2" stroke-dasharray="2.6 2"/>
      <rect x="204.5" y="196" width="7" height="12" rx="3.5"/>
      <polyline points="197,278 201,278 203.5,271 207,285 210,273 212.5,278 219,278"/>
    </g>
    <rect x="56.5" y="240" width="2" height="4" fill="#cbd5e1"/>
    <rect x="44" y="239.5" width="7" height="5" fill="#22c55e"/>
    <circle cx="50" cy="278" r="1.8" fill="#cbd5e1"/>
    <circle cx="208" cy="211" r="4.5" fill="#f87171"/>
    <path d="M208 234L217 250H199Z" fill="#fbbf24"/>
    <text x="208" y="248" fill="#0b1220" font-size="10" font-weight="800" text-anchor="middle">!</text>
    <!-- robot -->
    <g transform="translate(99 222)">
      <line x1="50" y1="0" x2="50" y2="-26" stroke="#94a3b8" stroke-width="2"/>
      <path d="M50 -27L63 -22L50 -17Z" fill="#f59e0b"/>
      <rect x="0" y="0" width="60" height="44" rx="9" fill="#e2e8f0"/>
      <path d="M9 0H51A9 9 0 0 1 60 9V15H0V9A9 9 0 0 1 9 0Z" fill="#cbd5e1"/>
      <line x1="4" y1="15" x2="56" y2="15" stroke="#94a3b8" stroke-width="1.2"/>
      <circle cx="49" cy="29" r="3.5" fill="#22c55e"/>
      <g fill="#1e293b" stroke="#475569" stroke-width="2">
        <circle cx="10" cy="48" r="7.5"/>
        <circle cx="30" cy="48" r="7.5"/>
        <circle cx="50" cy="48" r="7.5"/>
      </g>
    </g>

    <rect x="30" y="322" width="197" height="40" rx="10" fill="#111a2e" stroke="#0284c7" stroke-opacity="0.7"/>
    <text x="128.5" y="347" fill="#7dd3fc" font-size="14" font-weight="700" text-anchor="middle">Runtime data acquisition</text>

    <path d="M128.5 378V402" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- ===== Edge layer ===== -->
    <rect x="18" y="406" width="221" height="294" rx="14" fill="#16a34a" fill-opacity="0.07" stroke="#16a34a" stroke-opacity="0.8"/>
    <path d="M32 406H225A14 14 0 0 1 239 420V444H18V420A14 14 0 0 1 32 406Z" fill="#16a34a"/>
    <text x="128.5" y="431" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Edge layer</text>

    <rect x="30" y="456" width="197" height="38" rx="10" fill="#111a2e" stroke="#16a34a" stroke-opacity="0.7"/>
    <text x="128.5" y="480" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">Preprocessing</text>

    <rect x="30" y="506" width="197" height="180" rx="10" fill="#111a2e" stroke="#16a34a" stroke-opacity="0.7"/>
    <text x="128.5" y="528" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">Real-time</text>
    <text x="128.5" y="546" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">anomaly detection</text>
    <rect x="66" y="566" width="132" height="96" rx="6" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.55" stroke-dasharray="4 3"/>
    <line x1="66" y1="614" x2="198" y2="614" stroke="#38bdf8" stroke-opacity="0.5"/>
    <line x1="66" y1="582" x2="198" y2="582" stroke="#f87171" stroke-opacity="0.8" stroke-dasharray="4 3"/>
    <path d="M70 614C80 592 92 592 102 614S124 638 134 614S154 566 164 572S186 606 194 612" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    <text x="164" y="566" fill="#ef4444" font-size="15" font-weight="800" text-anchor="middle">!</text>
    <circle cx="48" cy="614" r="9" fill="#22c55e"/>
    <path d="M43.5 614L47 617.5L53 610.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M210 656L219 672H201Z" fill="#fbbf24"/>
    <text x="210" y="670" fill="#0b1220" font-size="10" font-weight="800" text-anchor="middle">!</text>

    <!-- ===== Cloud backend ===== -->
    <rect x="265" y="134" width="221" height="396" rx="14" fill="#dc2626" fill-opacity="0.07" stroke="#dc2626" stroke-opacity="0.8"/>
    <path d="M279 134H472A14 14 0 0 1 486 148V172H265V148A14 14 0 0 1 279 134Z" fill="#dc2626"/>
    <text x="375.5" y="159" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Cloud backend</text>

    <rect x="277" y="184" width="197" height="152" rx="10" fill="#111a2e" stroke="#dc2626" stroke-opacity="0.7"/>
    <text x="375.5" y="206" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle">RUL inference</text>
    <rect x="306" y="222" width="44" height="92" fill="#22c55e" fill-opacity="0.3"/>
    <rect x="350" y="222" width="40" height="92" fill="#eab308" fill-opacity="0.3"/>
    <rect x="390" y="222" width="52" height="92" fill="#ef4444" fill-opacity="0.3"/>
    <g stroke="#cbd5e1" stroke-opacity="0.5" stroke-dasharray="3 3">
      <line x1="350" y1="222" x2="350" y2="314"/>
      <line x1="390" y1="222" x2="390" y2="314"/>
    </g>
    <g stroke="#cbd5e1" stroke-width="1.6" fill="none">
      <path d="M306 316V218" marker-end="url(#arrow)"/>
      <path d="M304 314H456" marker-end="url(#arrow)"/>
    </g>
    <path d="M306 236C340 238 370 246 394 262S428 298 442 312" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="328" cy="290" r="9" fill="#22c55e"/>
    <path d="M323.5 290L327 293.5L333 286.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M370 280L379 296H361Z" fill="#fbbf24"/>
    <text x="370" y="294" fill="#0b1220" font-size="10" font-weight="800" text-anchor="middle">!</text>
    <text x="416" y="262" fill="#ef4444" font-size="18" font-weight="800" text-anchor="middle">!</text>

    <rect x="277" y="348" width="197" height="56" rx="10" fill="#111a2e" stroke="#dc2626" stroke-opacity="0.7"/>
    <text x="375.5" y="371" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle">Offline training</text>
    <text x="375.5" y="391" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle">&amp; evaluation</text>

    <rect x="277" y="416" width="197" height="98" rx="10" fill="#111a2e" stroke="#dc2626" stroke-opacity="0.7"/>
    <text x="375.5" y="440" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle">Model update</text>
    <g fill="#94a3b8" font-size="12.5" text-anchor="middle">
      <text x="375.5" y="462">Retraining, threshold</text>
      <text x="375.5" y="480">adjustment, distribution</text>
      <text x="375.5" y="498">of updated models</text>
    </g>

    <!-- ===== Application layer ===== -->
    <rect x="512" y="134" width="221" height="378" rx="14" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.85"/>
    <path d="M526 134H719A14 14 0 0 1 733 148V172H512V148A14 14 0 0 1 526 134Z" fill="#7c3aed"/>
    <text x="622.5" y="159" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Application layer</text>

    <rect x="524" y="184" width="197" height="114" rx="10" fill="#111a2e" stroke="#7c3aed" stroke-opacity="0.8"/>
    <text x="622.5" y="206" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">Decision layer</text>
    <g fill="#94a3b8" font-size="12.5" text-anchor="middle">
      <text x="622.5" y="228">Fusion of anomaly status</text>
      <text x="622.5" y="246">and RUL, considering</text>
      <text x="622.5" y="264">spare parts and</text>
      <text x="622.5" y="282">maintenance windows</text>
    </g>

    <path d="M622.5 298V318" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="524" y="320" width="197" height="116" rx="10" fill="#111a2e" stroke="#7c3aed" stroke-opacity="0.8"/>
    <text x="622.5" y="342" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">Maintenance</text>
    <text x="622.5" y="360" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">recommendations</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">
      <g transform="translate(534 372)"><rect width="64" height="22" rx="11" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e"/><text x="32" y="15" fill="#4ade80">CONTINUE</text></g>
      <g transform="translate(604 372)"><rect width="44" height="22" rx="11" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8"/><text x="22" y="15" fill="#7dd3fc">PLAN</text></g>
      <g transform="translate(654 372)"><rect width="58" height="22" rx="11" fill="#eab308" fill-opacity="0.15" stroke="#eab308"/><text x="29" y="15" fill="#facc15">MONITOR</text></g>
      <g transform="translate(566 402)"><rect width="54" height="22" rx="11" fill="#f97316" fill-opacity="0.15" stroke="#f97316"/><text x="27" y="15" fill="#fb923c">URGENT</text></g>
      <g transform="translate(626 402)"><rect width="44" height="22" rx="11" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444"/><text x="22" y="15" fill="#f87171">STOP</text></g>
    </g>

    <path d="M622.5 436V456" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="524" y="458" width="197" height="40" rx="10" fill="#111a2e" stroke="#7c3aed" stroke-opacity="0.8"/>
    <text x="622.5" y="483" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">Fleet management</text>

    <!-- ===== Data storage ===== -->
    <rect x="759" y="134" width="221" height="324" rx="14" fill="#a16207" fill-opacity="0.09" stroke="#ca8a04" stroke-opacity="0.85"/>
    <path d="M773 134H966A14 14 0 0 1 980 148V172H759V148A14 14 0 0 1 773 134Z" fill="#a16207"/>
    <text x="869.5" y="159" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Data storage</text>

    <rect x="771" y="184" width="197" height="78" rx="10" fill="#111a2e" stroke="#ca8a04" stroke-opacity="0.8"/>
    <text x="869.5" y="206" fill="#fde047" font-size="14" font-weight="700" text-anchor="middle">Historical data</text>
    <g fill="#94a3b8" font-size="12.5" text-anchor="middle">
      <text x="869.5" y="228">State data, run-to-failure,</text>
      <text x="869.5" y="246">sensor time series</text>
    </g>

    <rect x="771" y="274" width="197" height="78" rx="10" fill="#111a2e" stroke="#ca8a04" stroke-opacity="0.8"/>
    <text x="869.5" y="296" fill="#fde047" font-size="14" font-weight="700" text-anchor="middle">Event data</text>
    <g fill="#94a3b8" font-size="12.5" text-anchor="middle">
      <text x="869.5" y="318">Failures, repairs,</text>
      <text x="869.5" y="336">maintenance interventions</text>
    </g>

    <rect x="771" y="364" width="197" height="78" rx="10" fill="#111a2e" stroke="#ca8a04" stroke-opacity="0.8"/>
    <text x="869.5" y="386" fill="#fde047" font-size="14" font-weight="700" text-anchor="middle">Model base</text>
    <g fill="#94a3b8" font-size="12.5" text-anchor="middle">
      <text x="869.5" y="408">Labels, model parameters,</text>
      <text x="869.5" y="426">versions</text>
    </g>
  </g>

  <!-- data paths into the decision layer: edge anomaly status and cloud RUL -->
  <g fill="none" stroke="#cbd5e1" stroke-width="2">
    <path d="M227 614H499V246"/>
    <path d="M474 246H522" marker-end="url(#arrow)"/>
  </g>
</svg>
